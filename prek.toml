default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", files = { glob = "*.{rs,toml,yml,yaml,md,json}" } },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "cargo fmt"
language = "system"
entry = "sh -c 'cargo fmt && git diff --name-only --diff-filter=M | xargs git add'"
files = "\\.rs$"

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy -- -D warnings"
files = "\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "tests"
name = "cargo test"
language = "system"
entry = "cargo test"
stages = ["pre-push"]
pass_filenames = false