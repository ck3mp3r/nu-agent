# nu-agent configuration
# Generated by `agent config init`
# Full provider list: run `agent models list`
# API keys: run `agent provider auth login <provider>` (stored in the OS keychain, not here)

{{ACTIVE_MODEL}}

# ─── Templates ───────────────────────────────────────────
# Uncomment and fill in for providers you use.
#
# api_key accepts three forms:
#   api_key = "store:<name>"    vault lookup (run: agent provider auth login <name>)
#   api_key = "env:VAR_NAME"    read from an environment variable
#   api_key omitted             default: vault lookup by provider element name
#
# A raw key (a literal secret) is REJECTED at startup — never put a
# plaintext secret in config.toml.

# OpenAI
# [providers.openai]
# api_key = "store:openai"  # run: agent provider auth login openai
# # or omit api_key entirely — the vault lookup by provider name is automatic

# Anthropic
# [providers.anthropic]
# api_key = "store:anthropic"  # run: agent provider auth login anthropic

# Ollama Cloud
# [providers.ollama-cloud]
# provider = "openai"
# base_url = "https://ollama.com/v1"
# api_key = "store:ollama-cloud"  # run: agent provider auth login ollama-cloud

# Custom env var (non-standard name)
# [providers.my-gateway]
# provider = "openai"
# base_url = "https://gateway.example.com/v1"
# api_key = "env:MY_GATEWAY_KEY"  # reads MY_GATEWAY_KEY from the environment

# GitHub Copilot (OAuth — no api_key needed)
# [providers.github-copilot]
# # run: agent provider auth login github-copilot

# Local Ollama (no auth)
# [providers.ollama]
# provider = "ollama"
# base_url = "http://localhost:11434"


# ─── Permissions ──────────────────────────────────────────
# Tool permission defaults. "*" = global policy for all tools.
# Individual tools can override: read, edit, glob, grep, http, skill, etc.
# Actions: "allow", "deny", "ask" (prompt user)
#
# [permissions]
# "*" = "ask"
# read = "allow"
# glob = "allow"
# grep = "allow"
# edit = "ask"   # editing files is destructive
# patch = "ask"   # patching files is destructive
# http = "ask"   # network access
# skill = "ask"
#
# Nested field rules (e.g. restrict specific commands):
# [permissions.nu.command]
# "rm*" = "deny"
# "git push*" = "deny"

# ─── MCP Servers ───────────────────────────────────────────
# Configure MCP (Model Context Protocol) servers here.
# Transports: "stdio" (local process), "sse" or "http" (remote).
#
# [mcp.context7]
# transport = "http"
# url = "https://mcp.context7.com/mcp"
#
# [mcp.c5t]
# transport = "sse"
# url = "http://0.0.0.0:3737/mcp"
#
# [mcp.nu]
# transport = "stdio"
# command = "nu-mcp"
# args = ["--add-path", "/tmp"]
#
# [mcp.nu.env]
# GIT_PAGER = ""
#
# Auth (optional):
# [mcp.api]
# transport = "http"
# url = "https://api.example.com/mcp"
#
# [mcp.api.auth]
# type = "bearer"
# token = "your-token"  # a literal token, or "store:<name>" to read "mcp:bearer:<name>" from the OS keychain
#
# OAuth (for providers like GitHub Copilot):
# [mcp.api.auth]
# type = "oauth"
# # run: agent mcp auth login my-api

# Run `agent models sync` then `agent models list` to see all available providers.
