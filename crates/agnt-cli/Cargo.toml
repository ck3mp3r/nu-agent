[package]
name = "agnt-cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "agent"
path = "src/main.rs"

[features]
integration = []

[[test]]
name = "acp_e2e"
path = "test/acp_e2e.rs"
required-features = ["integration"]

[dependencies]
agnt-a2a = { workspace = true }
agnt-acp = { workspace = true }
agnt-core = { workspace = true }
agnt-tui = { workspace = true }
agnt-tty = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
# `nu-protocol` is required for interop with `agnt-core`'s public API, which is
# typed with `nu_protocol::{Span, Value, LabeledError}`. The CLI does not depend
# on the Nushell plugin protocol.
nu-protocol = { workspace = true }
oauth2 = { workspace = true }
open = "5"
rmcp = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
agent-client-protocol = { version = "3", features = ["process"] }
agnt-testkit = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
