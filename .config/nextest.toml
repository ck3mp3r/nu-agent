# cargo-nextest repository configuration
# https://nexte.st/docs/configuration/

# Unit tests only (no --features integration): fast feedback, high parallelism.
[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "10s", terminate-after = 2, grace-period = "2s" }
final-status-level = "slow"

# All tests (--features integration): lower parallelism for server tests,
# retries for flaky tests.
[profile.integration]
retries = 1
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "5s" }
global-timeout = "20m"
final-status-level = "slow"

# CI: complete run, no retries, JUnit XML report.
[profile.ci]
retries = 0
fail-fast = false
global-timeout = "30m"

[profile.ci.junit]
path = "junit.xml"
