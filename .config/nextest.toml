# cargo-nextest repository configuration
# https://nexte.st/docs/configuration/

# Setup scripts are the only nextest mechanism that hands environment
# variables to test processes: profiles accept no `env` key.
experimental = ["setup-scripts"]

# Unit tests only (no --features integration): fast feedback, high parallelism.
[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "10s", terminate-after = 2, grace-period = "2s" }
final-status-level = "slow"

# The nine tree-sitter grammar tests each pay a per-process grammar load
# (solo ~11-13 s). Nine-way machine contention stretches loads nonlinearly
# (staircase 11.3 → 57.1 s, tail past the 60 s wall); threads-required = 2
# caps that contention, and 2 x 30 s bounds a true hang.
[[profile.default.overrides]]
filter = 'package(agnt-runtime) and test(grammar_tests)'
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "5s" }
threads-required = 2

# All tests (--features integration): lower parallelism for server tests.
# Deterministic crates fail fast; only the timing-sensitive crates retry.
[profile.integration]
retries = 0
fail-fast = false
test-threads = 32
slow-timeout = { period = "20s", terminate-after = 2, grace-period = "5s" }
global-timeout = "20m"
final-status-level = "flaky"

# agnt-a2a hosts the timing-sensitive tests (real servers on ephemeral ports,
# mDNS responder, SSE timing); keep its retry.
[[profile.integration.overrides]]
filter = 'package(agnt-a2a)'
retries = 1

# The agnt-cli `acp_e2e` tests spawn a real `agent` subprocess per test and
# carry internal 30s budgets; give them a longer slow-timeout and reserve two
# thread slots to avoid CPU oversubscription.
[[profile.integration.overrides]]
filter = 'package(agnt-cli) and binary(acp_e2e)'
slow-timeout = { period = "40s", terminate-after = 2, grace-period = "5s" }
threads-required = 2

# CI: complete run, no retries, JUnit XML report.
[profile.ci]
retries = 0
fail-fast = false
global-timeout = "30m"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"

# The vault harness contract: no test probes the OS keychain, so every test
# process runs with AGENT_VAULT_BACKEND=env. The script writes the variable
# into $NEXTEST_ENV, which nextest hands to the tests its rule matches.
[scripts.setup.vault-env]
command = ['sh', '-c', 'echo AGENT_VAULT_BACKEND=env >> "$NEXTEST_ENV"']

[[profile.default.scripts]]
filter = 'all()'
setup = 'vault-env'

[[profile.integration.scripts]]
filter = 'all()'
setup = 'vault-env'

[[profile.ci.scripts]]
filter = 'all()'
setup = 'vault-env'
