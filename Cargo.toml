[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Internal crates
nu-agent-a2a = { path = "crates/nu-agent-a2a" }
nu-agent-core = { path = "crates/nu-agent-core" }
nu-agent-tui = { path = "crates/nu-agent-tui" }
nu-agent-tty = { path = "crates/nu-agent-tty" }

# Nu ecosystem
nu-plugin = "0.114.1"
nu-protocol = "0.114.1"
nu-parser = "0.114.1"

# LLM / AI
rig = { package = "rig-core", version = "0.40.0", default-features = false, features = ["derive", "rmcp", "test-utils"] }
rmcp = { version = "1.8.0", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "transport-io",
  "auth",
] }

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Networking
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
http = "1.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
bytes = "1"
url = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TUI
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"

# Utilities
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.27"
log = { version = "0.4", features = ["release_max_level_trace"] }
env_logger = "0.11"
sha2 = "0.11"
regex = "1"
ignore = "0.4"
similar = "3.1.1"
libc = "0.2"
pulldown-cmark = "0.13"
htmd = "0.5"
arboard = "3.6"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy", "yaml-load"] }
noyalib = "0.0.17"
oauth2 = "5.0"
rand = "0.10.1"
fs2 = "0.4"

# Dev/test
serial_test = "4.0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
panic = "abort"
strip = "symbols"
