name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release label (for example rc). Set only for a pre-release from main."
        required: false
        type: string
        default: ""

permissions:
  packages: write
  contents: write
  actions: read
  checks: read
  deployments: read
  issues: read
  pull-requests: read
  id-token: write

jobs:
  prep-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      base_version: ${{ steps.prep.outputs.base_version }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      suffix: ${{ steps.prep.outputs.suffix }}
      branch: ${{ steps.prep.outputs.branch }}
      flow: ${{ steps.prep.outputs.flow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup CI Tools
        uses: ck3mp3r/actions/ci-tools@main

      - name: Prepare release
        id: prep
        shell: nu {0}
        run: |
          use ci *

          # The ci module returns status records instead of raising errors.
          # Fail the step when a critical call reports a non-success status.
          def ensure-ok [what: string]: any -> any {
            let r = $in
            if ($r | describe | str starts-with "record") {
              let status = ($r | get -o status | default "success")
              let err = ($r | get -o error | default null)
              if $status != "success" or ($err | is-not-empty) {
                let msg = ($err | default "unknown error")
                error make {msg: $"($what) failed: ($msg)"}
              }
            }
            $r
          }

          "github-actions[bot]@users.noreply.github.com" | ci scm config

          let ref_name = "${{ github.ref_name }}"
          let prerelease_input = "${{ inputs.prerelease }}"
          let from_main = ($ref_name == "main")

          # Flow detection:
          #   full              -> main, no prerelease input
          #   prerelease-main   -> main, prerelease input set
          #   prerelease-branch -> any non-main branch
          let flow = if not $from_main {
            "prerelease-branch"
          } else if ($prerelease_input | is-not-empty) {
            "prerelease-main"
          } else {
            "full"
          }
          let prerelease = ($flow != "full")

          let current_version = (open Cargo.toml).workspace.package.version

          # Suffix:
          #   branch pre-release -> short SHA of HEAD (unique, no collision)
          #   main pre-release   -> explicit label + incrementing number (rc.1, rc.2)
          let suffix = if $flow == "prerelease-branch" {
            git rev-parse --short HEAD | str trim
          } else if $flow == "prerelease-main" {
            let label = $prerelease_input
            let prefix = $"v($current_version)-($label)."
            let existing = (git tag --list $"($prefix)*" | lines | where {|t| $t | is-not-empty })
            let next = if ($existing | is-empty) {
              1
            } else {
              let numbers = ($existing | each {|t| $t | str replace $prefix "" | into int })
              ($numbers | math max) + 1
            }
            $"($label).($next)"
          } else {
            ""
          }

          # Base version:
          #   full               -> semver bump from the latest tag
          #   main pre-release   -> current version (suffix appended)
          #   branch pre-release -> current version (suffix appended, not written to Cargo.toml)
          let base_version = if $flow == "full" {
            ci scm semver (ci scm latest-tag) $current_version
          } else {
            $current_version
          }
          let version = if $prerelease { $"($base_version)-($suffix)" } else { $base_version }

          # Branch:
          #   full / main pre-release -> release/<version> created from main
          #   branch pre-release      -> the feature branch itself (no release branch)
          let branch = if $flow == "prerelease-branch" {
            $ref_name
          } else {
            $"release/($version)"
          }

          if $flow != "prerelease-branch" {
            # Create and push the release branch from main. --reuse recovers a
            # release branch left behind by a previous failed run instead of
            # silently continuing on main.
            $version | ci scm branch --release --version $version --from $ref_name --reuse --push | ensure-ok "ci scm branch"
            # Update the package version and refresh Cargo.lock
            let files = (ci cargo update-version $version | ensure-ok "ci cargo update-version")
            $files | ci scm commit -m $"Prepare release ($version)" --push | ensure-ok "ci scm commit (version bump)"
          }

          [
            $"version=($version)"
            $"base_version=($base_version)"
            $"prerelease=($prerelease)"
            $"suffix=($suffix)"
            $"branch=($branch)"
            $"flow=($flow)"
          ] | save --append $env.GITHUB_OUTPUT

  build:
    needs: prep-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            nix_system: x86_64-linux
          - os: macos-15
            nix_system: x86_64-darwin
          - os: macos-15
            nix_system: aarch64-darwin
          - os: ubuntu-24.04-arm
            nix_system: aarch64-linux
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.branch }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          github-token: ${{github.token}}

      - name: Build archive for ${{ matrix.nix_system }}
        run: nix build .#archive --print-build-logs

      - name: Copy build outputs for uniqueness
        run: |
          # Archive package creates generic filenames, so we rename them with system suffix
          cp result/nu-agent.tgz ${{ github.workspace }}/nu-agent-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.tgz
          cp result/nu-agent.sha256 ${{ github.workspace }}/nu-agent-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.sha256
          cp result/nu-agent-nix.sha256 ${{ github.workspace }}/nu-agent-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}-nix.sha256

      - name: Upload build outputs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nu-agent-assets-${{ matrix.nix_system }}
          path: |
            ${{ github.workspace }}/nu-agent-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.tgz
            ${{ github.workspace }}/nu-agent-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}.sha256
            ${{ github.workspace }}/nu-agent-${{ needs.prep-release.outputs.version }}-${{ matrix.nix_system }}-nix.sha256

  finalize-release:
    needs:
      - prep-release
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT }}

      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Setup CI Tools
        uses: ck3mp3r/actions/ci-tools@main

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Finalize release
        shell: nu {0}
        run: |
          use ci *

          # The ci module returns status records instead of raising errors.
          # Fail the step when a critical call reports a non-success status.
          def ensure-ok [what: string]: any -> any {
            let r = $in
            if ($r | describe | str starts-with "record") {
              let status = ($r | get -o status | default "success")
              let err = ($r | get -o error | default null)
              if $status != "success" or ($err | is-not-empty) {
                let msg = ($err | default "unknown error")
                error make {msg: $"($what) failed: ($msg)"}
              }
            }
            $r
          }

          "github-actions[bot]@users.noreply.github.com" | ci scm config

          let version = "${{ needs.prep-release.outputs.version }}"
          let base_version = "${{ needs.prep-release.outputs.base_version }}"
          let prerelease = "${{ needs.prep-release.outputs.prerelease }}"
          let suffix = "${{ needs.prep-release.outputs.suffix }}"
          let branch = "${{ needs.prep-release.outputs.branch }}"
          let flow = "${{ needs.prep-release.outputs.flow }}"
          # version already carries the suffix for pre-releases
          let release_tag = $"v($version)"

          # Generate platform data and commit
          let data_files = (ci artifacts platform-data $version "./artifacts" "nu-agent" --tag $release_tag)
          if ($data_files | is-empty) {
            error make {msg: "ci artifacts platform-data produced no files"}
          }
          $data_files | ci scm commit -m $"Add platform data for release ($version)" --push | ensure-ok "ci scm commit (platform data)"

          # Prepare architecture data with hashes
          let architectures = [
            {
              name: "aarch64-darwin"
              hash: (open $"./artifacts/nu-agent-assets-aarch64-darwin/nu-agent-($version)-aarch64-darwin.sha256" | str trim)
            }
            {
              name: "aarch64-linux"
              hash: (open $"./artifacts/nu-agent-assets-aarch64-linux/nu-agent-($version)-aarch64-linux.sha256" | str trim)
            }
            {
              name: "x86_64-darwin"
              hash: (open $"./artifacts/nu-agent-assets-x86_64-darwin/nu-agent-($version)-x86_64-darwin.sha256" | str trim)
            }
            {
              name: "x86_64-linux"
              hash: (open $"./artifacts/nu-agent-assets-x86_64-linux/nu-agent-($version)-x86_64-linux.sha256" | str trim)
            }
          ]

          # Update Homebrew formula
          open Formula/nu-agent.rb | ci homebrew update-formula $version "nu-agent" $architectures | save --force Formula/nu-agent.rb

          # Commit the formula update
          ["Formula/nu-agent.rb"] | ci scm commit -m $"Update Homebrew formula for ($version)" --push | ensure-ok "ci scm commit (formula)"

          # Full releases merge the release branch back to main
          if $flow == "full" {
            ci scm merge $branch -m $"Release ($version)" --push | ensure-ok "ci scm merge"
          }

          # Create release and upload artifacts
          if $prerelease == "true" {
            ci github release create $base_version --prerelease --suffix $suffix --target $branch | ensure-ok "ci github release create"
          } else {
            ci github release create $version | ensure-ok "ci github release create"
          }
          glob "./artifacts/**/*.*" | ci github release upload $release_tag | ensure-ok "ci github release upload"

          # Clean up the release branch for full releases and main pre-releases.
          # Branch pre-releases build from the feature branch — nothing to clean up.
          if $flow != "prerelease-branch" {
            ci scm cleanup $branch --remote --local
          }

        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
