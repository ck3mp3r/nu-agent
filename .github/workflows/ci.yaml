---
name: CI Build & Cache
on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.nix"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "crates/**"
  pull_request:
    paths:
      - "**/*.nix"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "crates/**"

permissions:
  id-token: write
  contents: read

env:
  XDG_CONFIG_HOME: /var/tmp/xdg-config-home
  NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: nix develop .#ci --command cargo fmt -- --check

      - name: Clippy
        run: nix develop .#ci --command cargo clippy --all-features --tests -- -D warnings

      - name: Build workspace
        run: nix develop .#ci --command cargo build --workspace

      - name: Test
        run: nix develop .#ci --command cargo nextest run --features integration --profile ci

      # nextest writes the ci profile report to target/nextest/ci/junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: target/nextest/ci/junit.xml

  nix-build-cache:
    name: Nix build & cache
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for git diff

      - name: Install Determinate Nix
        run: curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --no-confirm

      - name: Setup CI Tools
        uses: ck3mp3r/actions/ci-tools@main

      - name: Build, test, and cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: nu {0}
        run: |
          use ci *

          # Build the package
          let results = ("." | ci nix build nu-agent)

          let failed = ($results | where status != 'success')
          if ($failed | length) > 0 {
            print '❌ Build failed'
            exit 1
          }

          let store_path = ($results | where status == 'success' | first | get path)

          # Determine if we should push to cache (only on main)
          let should_cache = ($env.GITHUB_REF == 'refs/heads/main')

          if $should_cache {
            print '✓ Pushing closure to ck3mp3r.cachix.org...'
            let closure_paths = ($store_path | ci nix closure)
            let cache_results = ($closure_paths | ci nix cache 'https://ck3mp3r.cachix.org' --upstream 'https://cache.nixos.org')

            let total_paths = ($closure_paths | length)
            let pushed_count = ($cache_results | where cached == false | length)
            let summary = [
              $"## 🏗️ Build & Cache Summary"
              ""
              $"**Store path:** ($store_path)"
              ""
              $"**Total paths:** ($total_paths)  **Pushed:** ($pushed_count)"
            ]
            $summary | ci github summary
          } else {
            print 'ℹ️ Branch push — skipping cache push'
            let closure_paths = ($store_path | ci nix closure)
            $closure_paths | ci nix cache 'https://ck3mp3r.cachix.org' --upstream 'https://cache.nixos.org' --dry-run

            let summary = [
              $"## 🏗️ Build Summary"
              ""
              $"**Store path:** ($store_path)"
              ""
              "Cache push skipped (not main branch)."
            ]
            $summary | ci github summary
          }
